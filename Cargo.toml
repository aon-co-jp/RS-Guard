[workspace]

[package]
name = "rs-guard"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
description = "Supply-chain repo/dependency malware-pattern scanner + optional ClamAV integration for the aon-co-jp ecosystem"
repository = "https://github.com/aon-co-jp/RS-Guard"

[lib]
name = "rs_guard"
path = "src/lib.rs"

[[bin]]
name = "rs-guard"
path = "src/main.rs"

[dependencies]
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
walkdir = "2"
regex = "1"
poem = "3.1"
tokio = { version = "1", features = ["full"] }
tracing = "0.1"
tracing-subscriber = "0.3"

[dev-dependencies]
tempfile = "3"
